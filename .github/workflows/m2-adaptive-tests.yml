name: M2 adaptive reputation tests

on:
  push:
    branches:
      - m2-adaptive-reputation
  pull_request:
    branches:
      - m1-v63-compat

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run all regression tests
        run: node --test
