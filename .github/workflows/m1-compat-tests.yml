name: M1 V6.3 compatibility tests

on:
  push:
    branches:
      - m1-v63-compat
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run compatibility tests
        run: node --test
