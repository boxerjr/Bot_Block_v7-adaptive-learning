name: M1 V6.3 compatibility tests

on:
  push:
    branches:
      - m1-v63-compat
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  m1-compat:
    name: m1-compat
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Run compatibility tests
        run: node --test
