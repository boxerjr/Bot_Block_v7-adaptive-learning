name: M2.1 live shadow tests

on:
  push:
    branches:
      - m2-1-live-shadow
  pull_request:
    branches:
      - m2-adaptive-reputation

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Run all regression tests
        run: node --test
