name: M2.1 live shadow tests

on:
  push:
    branches:
      - m2-1-live-shadow
  pull_request:
    branches:
      - m2-adaptive-reputation

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run all regression tests
        run: node --test
