name: V7 regression tests

on:
  push:
    branches:
      - main
      - m2-2-public-monitor
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  v7-regression:
    name: v7-regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Run release verification
        run: npm run verify
