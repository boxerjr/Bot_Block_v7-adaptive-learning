name: M2.2 public monitor tests

on:
  push:
    branches:
      - m2-2-public-monitor
  pull_request:
    branches:
      - m2-1-live-shadow

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run all regression tests
        run: node --test
