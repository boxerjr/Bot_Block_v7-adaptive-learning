name: V7 regression tests

on:
  push:
    branches:
      - main
      - m2-2-public-monitor
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  v7-regression:
    name: v7-regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run all regression tests
        run: node --test
